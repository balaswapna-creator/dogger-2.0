# backend/pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = dogger.settings.test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --no-cov-on-fail
testpaths = .
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    api: API tests

# Coverage settings
[coverage:run]
source = .
omit = 
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*
    */site-packages/*
    manage.py
    */settings/*
    */wsgi.py
    */asgi.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov